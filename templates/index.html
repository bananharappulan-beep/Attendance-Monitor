<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='5') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css', v='3') }}">
</head>
<body>
<div class="container">

  <header class="topbar">
    <div class="topbar-brand">
      <h1>Attendance Monitor</h1>
      <div id="userbar" class="userbar">
        <span id="userIdentity" class="who"></span>
        <div id="userMenuControl" class="user-menu hidden">
          <button id="userMenuToggle" class="user-menu-toggle" type="button" aria-label="User menu" title="User menu" aria-haspopup="true" aria-expanded="false" aria-controls="userMenu">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          </button>
          <div id="userMenu" class="user-menu-dropdown hidden">
            <button id="ubPw" type="button">Change Password</button>
            <button id="ubOut" type="button">Logout</button>
          </div>
        </div>
      </div>
    </div>
    <div class="controls">
      <label>Branch
        <select id="branch"></select>
      </label>
      <label>Date
        <input id="date" type="date">
      </label>
      <button id="refresh" class="btn"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v4h4M4 13a8 8 0 0 0 14.9 3M20 19v-4h-4"/></svg>Refresh</button>
        <div id="exportActions" class="top-export-actions">
          <button id="exportPdf" class="btn-export" title="Export this branch's Daily Report as PDF"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 19h14"/></svg>Export PDF</button>
          <button id="exportAll" class="btn-export" title="Download one PDF per branch"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 19h14"/></svg>All PDFs</button>
          <button id="exportMatrixPdf" class="btn-export hidden" title="Export the Status Matrix as PDF"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 19h14"/></svg>Matrix PDF</button>
          <button id="exportInactivePdf" class="btn-export hidden" title="Export Inactive Employees as PDF"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 19h14"/></svg>Inactive PDF</button>
          <button id="exportSummaryPdf" class="btn-export hidden" title="Export the Overall Summary as PDF"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 19h14"/></svg>Summary PDF</button>
        </div>
    </div>
  </header>

  <div class="status-search-row">
    <div id="msg" class="msg"></div>
    <div id="employeeSearchRow" class="employee-search-row">
      <div class="employee-search">
        <svg class="employee-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
        <input id="employeeSearch" type="search" placeholder="Search code or name" aria-label="Search employee code or name" autocomplete="off">
      </div>
    </div>
  </div>

  <div class="app-layout">
    <aside class="sidebar">
      <label class="sidebar-filter">Business Name
        <select id="businessName">
          <option value="ALL">ALL BUSINESS</option>
          <option value="MAGNUS" selected>MAGNUS</option>
          <option value="ALIMS">ALIMS</option>
          <option value="MERCHX">MERCHX</option>
          <option value="M&amp;D">M&amp;D</option>
          <option value="HU">HU</option>
          <option value="GRANDIS">GRANDIS</option>
        </select>
      </label>
      <label class="sidebar-filter"><span id="locationTypeLabel">Location Type</span>
        <select id="locationType">
          <option value="core-office">CORE OFFICE</option>
          <option value="branch" selected>BRANCH</option>
        </select>
      </label>
      <nav class="tabs" aria-label="Attendance views">
        <button data-tab="daily" class="tab"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>Daily Report</button>
        <button data-tab="matrix" class="tab"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM4 10h16M10 4v16"/></svg>Status Matrix</button>
        <button data-tab="inactive" class="tab"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0M19 5l2 2-4 4"/></svg>Inactive Employees</button>
        <button data-tab="summary" class="tab"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9M12 19V5M19 19v-7"/></svg>Overall Summary</button>
        <button id="sidebarUsers" class="tab sidebar-admin hidden"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM19 8v6M22 11h-6"/></svg>Users &amp; Access</button>
      </nav>
    </aside>

    <main class="workspace">
  <section id="daily">
    <div id="cards" class="cards"></div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr id="dailyHead"></tr></thead>
        <tbody id="dailyBody"></tbody>
      </table>
    </div>
  </section>

  <section id="matrix" class="hidden">
    <div class="matrix-controls">
      <label>From <input id="from" type="date"></label>
      <label>To <input id="to" type="date"></label>
      <span class="hint">Defaults to the month of the selected date. Blank = no attendance records for that date yet.</span>
    </div>
    <div class="table-wrap matrix-wrap">
      <table id="matrixTable" class="matrix-table"></table>
    </div>
  </section>

  <section id="inactive" class="hidden">
    <div class="matrix-controls">
      <label>Start Date (optional) <input id="inactiveStartDate" type="date"></label>
      <label>Days Inactive <input id="inactiveDays" type="number" min="1" step="1" value="2"></label>
      <button id="inactiveUpdate" class="btn"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v4h4M4 13a8 8 0 0 0 14.9 3M20 19v-4h-4"/></svg>Update</button>
    </div>
    <div class="hint" id="inactiveHint">Leave Start Date blank to check the latest archived dates.</div>
    <div class="table-wrap inactive-table-wrap">
      <table id="inactiveTable" class="data-table">
        <thead><tr><th>EMPLOYEE CODE</th><th>EMPLOYEE NAME</th></tr></thead>
        <tbody id="inactiveBody"></tbody>
      </table>
    </div>
  </section>

  <section id="summary" class="hidden">
    <div class="hint" id="summaryHint"></div>
    <div class="table-wrap">
      <table id="summaryTable" class="data-table">
        <thead>
          <tr>
            <th>SL NO</th><th>BRANCH</th><th>TOTAL EMPLOYEES</th>
            <th>PRESENT</th><th>HALF DAY</th><th>ABSENT</th><th>TOTAL WORKING HOURS</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>
  </section>
    </main>
  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="{{ url_for('static', filename='js/auth-ui.js', v='4') }}"></script>
<script src="{{ url_for('static', filename='js/app.js', v='11') }}"></script>
</body>
</html>
